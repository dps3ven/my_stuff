name: Security Checks

on:
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 9am UTC to catch new vulnerabilities
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Check for high/critical vulnerabilities
        run: |
          # Capture JSON on stdout only; keep stderr out of the file so the
          # JSON stays parseable. `|| true` because npm audit exits non-zero
          # when vulnerabilities are present.
          npm audit --json > audit-results.json 2>/dev/null || true

          HIGH=$(node -e "
            try {
              const r = require('./audit-results.json');
              const v = (r && r.metadata && r.metadata.vulnerabilities) || {};
              console.log((v.high || 0) + (v.critical || 0));
            } catch (e) {
              console.error('Could not parse audit results:', e.message);
              process.exit(2);
            }
          ")

          echo "High/Critical vulnerabilities: $HIGH"
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::Found $HIGH high/critical vulnerabilities"
            npm audit --audit-level=high
            exit 1
          fi
          echo "No high/critical vulnerabilities found"
