<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Musical Inventory</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: auto;
    }
    #root {
      height: 100%;
      overflow: auto;
    }

    /* Force scrollbars to always be visible across all browsers */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(241, 241, 241, 0.3);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(136, 136, 136, 0.8);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(85, 85, 85, 0.9);
    }

    /* For Firefox */
    * {
      scrollbar-width: auto;
      scrollbar-color: rgba(136, 136, 136, 0.8) rgba(241, 241, 241, 0.3);
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
